# CVE-2026-129496 lab - Apache drop-in (see lab/php-129496/README.md).
#
# Three jobs, each copied from what the reference labs ship:
#  * LimitRequestFieldSize 4194304 - the abraxas/evenomn labs both raise this so the ~87 KB
#    base64 Authorization header the RCE variant carries fits (their labs' apache-lab.conf /
#    poc/lab/apache.conf carry the same line for the same reason). Default is 8190.
#  * DirectoryIndex index.php - the app is a single front-controller file, as in
#    abraxas/lab/www/index.php.
#  * FallbackResource /index.php - every path that is not a real file is served by the
#    front controller, which is what makes the store variant's `/check` spelling (the
#    googlesky harness route, and cveForge's scanner path for this family) a real request on
#    this victim instead of an Apache 404 that never reaches PHP. The two sibling labs
#    learned the same way that a .htaccess cannot work on this image (AllowOverride None),
#    so the rule is a conf-enabled drop-in.
LimitRequestFieldSize 4194304

<Directory /var/www/html>
	Require all granted
	DirectoryIndex index.php
	FallbackResource /index.php
</Directory>
