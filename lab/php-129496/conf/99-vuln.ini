; CVE-2026-129496 lab - VULNERABLE configuration (the pair the advisory names).
;
; The advisory (security@php.net, GHSA-gr4f-wgx5-jpfv): "In non-thread-safe builds, a
; diagnostic written to a file-based error_log during module startup, for example for an
; invalid date.timezone value [...], causes the timezone cache to be allocated in startup
; memory that is freed while a reference to it is kept."
;
; So the vulnerable configuration is exactly two lines plus the NTS base (php:8.4.26-apache
; is a non-thread-safe apache2handler build - php -m shows ZTS => disabled):
;   error_log = a file              (the allocation happens only when PHP's own file log opens)
;   date.timezone = an invalid zone (the diagnostic that makes PHP write during startup)
; Both are restated here explicitly; the mitigated twin changes exactly ONE line -
; date.timezone - and keeps the rest byte-identical.

; The first half of the pair: PHP's own file error_log. (Unset, mod_php logs through Apache,
; which is not this bug's path - the same fact made the fleet's ff-php unable to show it.)
error_log = /var/log/php-error.log
log_errors = 1

; The second half of the pair: a date.timezone that cannot be resolved, so the very first
; timestamp PHP formats is a diagnostic. The value is the abraxas lab's (`Not/AZone`);
; evenomn's lab uses `No/Such_Zone` - any unresolvable zone is the same condition.
date.timezone = Not/AZone

; The condition the request exploits: a POST over memory_limit aborts the request before
; the date extension is re-entered, which is the reference PoCs' chosen early-abort
; (abraxas/lab/poc.py POST_BODY = b"x=" + C*3MiB against memory_limit=2M).
memory_limit = 2M
post_max_size = 8M
upload_max_filesize = 8M

; display_errors is On so the memory-limit fatal is visible in the response - the observable
; that distinguishes "the worker died" from "the app answered" for the patched/mitigated
; twins; same reasoning as lab/php-129474/conf/99-vuln.ini.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Kept at the shipped defaults so the only differences between this container and the
; patched twin are the base version (measured on the base image, restated here):
max_input_vars = 1000
enable_post_data_reading = 1
expose_php = 1
opcache.enable = 0
