; CVE-2026-129496 lab - VENDOR-MITIGATED configuration.
;
; One line differs from conf/99-vuln.ini: date.timezone gets a value PHP can resolve, so
; module startup produces no diagnostic and the timezone cache is never allocated on the
; startup heap that startup then frees. This is the first mitigation the vendor's own fix
; text names ("Until then, correct the setting that prints at startup [...]") and it is the
; causality control for the entry: if the crash on :8101 depends on this single line and not
; on the container, this container answers instead of dying.
;
; error_log stays a FILE - the other half of the vulnerable pair is kept unchanged, so what
; is being tested is exactly "was there a diagnostic to write at startup", never "file vs
; syslog transport". (abraxas' fix section also allows error_log=syslog as the mitigation;
; the valid-timezone variant keeps the log file itself as readable evidence: on this twin it
; holds the app's own fatal and no startup warning, while the vuln twin's file holds the
; startup warning - the pair recorded in the run as victim-log-trace-pair.txt.)

date.timezone = Etc/UTC

error_log = /var/log/php-error.log
log_errors = 1

memory_limit = 2M
post_max_size = 8M
upload_max_filesize = 8M

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

max_input_vars = 1000
enable_post_data_reading = 1
expose_php = 1
opcache.enable = 0
