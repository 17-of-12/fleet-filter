# prefork MPM, pinned to one worker (abraxas/lab/mpm-prefork.conf, copied).
# The CVE fires on the FIRST request of a worker; with the stock StartServers the lab
# cannot say which worker answered a request. One worker means every request after a
# death is served by the freshly spawned one - the same trick the abraxas and evenomn
# labs use ("a single prefork worker, so every attempt is handled by a fresh process").
# ServerLimit stays above 1 so a child that dies can be replaced.
<IfModule mpm_prefork_module>
	StartServers		1
	MinSpareServers		1
	MaxSpareServers		1
	MaxRequestWorkers	1
	ServerLimit		4
	MaxConnectionsPerChild	0
</IfModule>
