# Lab httpd configuration - deliberately the vulnerable shape, not a hardened one.
#
# Two listeners: 8080 cleartext with h2c enabled (so an HTTP/2 exploit can be delivered without
# TLS), and 8443 TLS with ALPN h2 (so the same can be delivered the way a real client would).
# `Protocols h2 h2c http/1.1` is the advisory workaround reversed on purpose: the project's own
# mitigation is to remove h2/h2c, and a victim that already removed them cannot be exploited.
ServerRoot "/usr/local/apache2"
Listen 8080
Listen 8443
ServerName ff-httpd-lab
ServerTokens Full
ServerSignature On
TraceEnable Off

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so
LoadModule cgid_module modules/mod_cgid.so

User daemon
Group daemon

# Ordered by preference: a client that can do h2 gets h2.
Protocols h2 h2c http/1.1
H2Direct on
H2Push off

LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" ct=%{Content-Type}i cl=%{Content-Length}i ho=%{Host}i proto=%H" combined
ErrorLog /proc/self/fd/2
# Path B needs a file. The project's filter regex is written against the combined format, and the
# research record for this project already contains a failregex that matched 0 of 3809 real lines -
# so the victim logs to a mounted path where fail2ban (or a tailer) can be tested against real bytes
# instead of a fixture.
CustomLog /state/log/access_log combined
LogLevel warn

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    AllowOverride None
    Require all granted
</Directory>

<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

# CVE-2021-41773 lives here: 2.4.49 with a ScriptAlias and `Require all granted` lets a traversal
# reach files outside the alias, and with mod_cgid loaded the target can be executed. 2.4.50 fixed
# the encoding, 2.4.51 the escape; the config below is the documented vulnerable precondition.
ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>
AddHandler cgi-script .cgi .sh .pl
AddType text/html .html

<VirtualHost *:8443>
    SSLEngine on
    SSLCertificateFile /state/tls/server.crt
    SSLCertificateKeyFile /state/tls/server.key
    Protocols h2 http/1.1
    DocumentRoot "/usr/local/apache2/htdocs"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
