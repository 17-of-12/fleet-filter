# CVE-2026-129474 lab - Apache drop-in (see lab/php-129474/README.md).
#
# The reference probe walks the app's ROUTES (/api/import, /api/v1/import, /graphql, ...). In the
# base image's Debian Apache those paths are only reachable if the app declares them as routes,
# which is what FallbackResource does: any request that is not a real file runs /index.php with
# the original path in REQUEST_URI. The image's <Directory /var/www/> sets AllowOverride None, so
# the FrontController .htaccess a real vhost would use cannot work here; a conf-enabled file can.
<Directory /var/www/html>
    FallbackResource /index.php
</Directory>
