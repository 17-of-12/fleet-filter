; CVE-2026-129474 lab - VULNERABLE configuration.
; These are the shipped defaults of php:8.5.12-apache restated line by line (measured with
; `php -i` on the base image: fatal_error_backtraces => On, zend.exception_ignore_args => Off),
; plus the app's documented API memory_limit. Restating the defaults explicitly is what keeps the
; pair honest: the mitigated twin changes exactly ONE of these lines.
;
; display_errors is On only so the fatal error - the observable the CVE's detection depends on -
; is visible in the response; same reasoning as lab/php-115560/conf/99-vuln.ini.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; The app documents 2M for its API pool (see lab/php-129474/README.md): the reference probe body
; (~640 KiB JSON) normalised four times exceeds it inside the magic-method call.
memory_limit = 2M

; Precondition #1 (advisory): "with fatal_error_backtraces enabled (the default)" - PHP 8.5 default,
; measured On on the base image.
fatal_error_backtraces = On

; Precondition #2 (advisory): "zend.exception_ignore_args disabled" - the default php.ini value is
; Off; php.ini-production ships On and the advisory says On prevents the bug. The vulnerable state
; is therefore the stock default, restated here explicitly.
zend.exception_ignore_args = Off
