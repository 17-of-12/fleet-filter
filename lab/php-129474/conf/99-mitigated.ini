; CVE-2026-129474 lab - MITIGATED configuration.
; Identical to 99-vuln.ini except for ONE line: zend.exception_ignore_args.
; The advisory names it in words: "php.ini-production enables zend.exception_ignore_args, which
; prevents this." An app running the production ini on the same unfixed 8.5.12 is the vendor's
; published prevention, so running the exploit here is the causality control - the effect has to
; come from argument collection (the thing the CVE is about), not from the container or the app.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 2M

fatal_error_backtraces = On

; === THE MITIGATION ===
zend.exception_ignore_args = On
