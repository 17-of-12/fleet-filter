[package]
name = "matchbench"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
aho-corasick = { version = "=1.1.5", default-features = true }

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
