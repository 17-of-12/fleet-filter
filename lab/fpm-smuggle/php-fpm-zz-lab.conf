# The second precondition: the app must be able to read php://input, which multipart does not allow
# while PHP consumes the body into $_POST. Without this the app reads 0 bytes and leaves no remainder.
; The CVE-2026-129289 precondition: the app may read php://input directly and leave a remainder.
; Without this, PHP consumes a multipart body into $_POST and php://input reads 0 bytes, so there
; is never a leftover record for FPM to misparse when the connection is reused.
[www]
php_admin_flag[enable_post_data_reading] = off
