# Front end for the CVE-2026-129289 victim. fastcgi_keep_conn on is the vulnerability precondition:
# without connection reuse there is no leftover-record parse for FPM to make.
server {
    listen 80;
    root /app;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME /app$fastcgi_script_name;
        fastcgi_pass   ff-fpm-upstream:9000;
        # The vulnerability precondition: the front end keeps the FastCGI connection and reuses it.
        fastcgi_keep_conn on;
    }
}
