# /etc/fail2ban/action.d/fleet-filter.conf
#
# Fleet-Filter action: hand the verdict to the quarantine controller instead of the
# firewall. This is what keeps fail2ban usable under the project policy of "no hard
# blocks" - a ban becomes a RewriteMap lease, not an nftables DROP.
#
# Repo source of truth: projects/Fleet-Filter/detector/fail2ban/action.d/fleet-filter.conf

[Definition]

# No setup/teardown commands: the controller owns the map, so there is nothing for
# fail2ban to install or remove in the packet filter.
actionstart =
actionstop  =
actioncheck =

# <name> = jail name, <ip> = offending address, <failures> = failure count.
# The tag is <failures> (plural): fail2ban 1.0.2 leaves an unknown tag like <failure>
# unsubstituted, and the literal `<` then breaks /bin/sh with
# "syntax error near unexpected token `newline`" and the ban fails.
# The verdict lives here so a jail that warrants `confirmed` can override actionban
# inline instead of forking a second action file.
actionban = /usr/local/bin/f2b-fleet-filter --verdict suspect <name> <ip> <failures>

# Deliberate no-op. fail2ban runs its own ban timer; if unban also revoked the lease we
# would have two clocks expiring the same address. adaptive-tarpit.timer stays the only
# reaper, and the controller's store stays the only place state is written.
actionunban = /bin/true
