# /etc/fail2ban/filter.d/fleet-filter.conf
#
# Behavioural (Path B) filter for the Fleet-Filter project: scanner behaviour against
# an Apache vhost, expressed as repeated error responses in the combined access log.
#
# Repo source of truth: projects/Fleet-Filter/detector/fail2ban/filters.d/fleet-filter.conf

[Definition]

# Apache combined format:
#   203.0.113.192 - - [13/Nov/2026:15:28:03 -0500] "GET /ldap/ HTTP/1.1" 302 854 "-" "UA"
#
# Statuses counted as failures: 400 401 404 405 500.
# 403 is deliberately NOT counted. 403 is exactly what our own tarpit answers, so
# counting it would let a tarpitted client accumulate new failures against itself -
# the feedback loop docs/FLEET-STATE.md calls out ("exclude tarpitted traffic from
# detection telemetry"). Everything already under lease is also skipped by the
# controller, so a duplicate verdict costs nothing, but not counting it keeps the
# failure counters honest.
#
# 500 added 2026-11-24, after measuring the shipped pattern against a live victim:
# the CVE-2021-41773 traversal on httpd 2.4.49 logs
#   "GET /cgi-bin/.%2e/.../bin/sh HTTP/1.1" 500 625
# so the one request that actually reached the vulnerable CGI path was invisible to the
# detector while an ordinary 404 was counted. A request that makes the server throw is at
# least as interesting as one it refuses, and an exploit that lands often answers 200 or
# 500 rather than 404. Caveat recorded rather than hidden: on a host with a genuinely
# broken application, counting 500s will eventually ban real users, so this set is a
# hypothesis to be tuned against that host's historical log before it is enabled in
# production - which is exactly the rule the detection design already states for every
# threshold.
#
# Exploit strings (Path A: /h2probe-, bodyless Content-Type, h2c preface) are matched by
# controller/signatures/signatures.yaml, not here; this filter is rate/scanner behaviour.
#
# Regex note (measured on lab-web01, fail2ban 1.0.2): a bracket character class in the
# timestamp field matches nothing - `\[[^]]+\]` yields 0 matches while `\[.*\]` yields
# the correct count. Use the greedy form for the date field.
failregex = ^<HOST> \S+ \S+ \[.*\] "(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH|TRACE|CONNECT) \S+ HTTP/[0-9.]+" (400|401|404|405|500) \d+
