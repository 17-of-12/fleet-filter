# /etc/fail2ban/filter.d/php-fatal.conf
#
# Behavioural (Path B) filter for the PHP engine class: a request that exhausts memory_limit.
# This is the observable for PHP2Shell (CVE-2026-109618 / CVE-2026-109619), whose trigger lives in the
# multipart body and is therefore out of reach of every URI-level rule and of the gateway's path and
# shape surface. The engine does not stay quiet about it, though: it prints a fatal, and if PHP has
# `log_errors = On` that fatal lands in Apache's error log with the client address attached.
#
# Measured 2026-11-24 on ff-php (php:8.4.26-apache, mod_php), line captured verbatim from the error
# log after a 200 MB chunked multipart POST:
#
#   [Tue Nov 24 21:12:13.424239 2026] [php:error] [pid 12:tid 12] [client 10.20.1.148:54612]
#   PHP Fatal error:  Allowed memory size of 134217728 bytes exhausted (tried to allocate 65016420 bytes)
#   in Unknown on line 0
#
# THE CONFIGURATION DEPENDENCY IS THE POINT. The official PHP images ship `log_errors = Off` and
# `error_log = no value`, and in that state this fatal appears ONLY in the response body, which the
# gateway does not read and fail2ban cannot see. Measured on the same image before the setting was
# changed: zero matching lines in the error log for a request whose body contained the fatal. So this
# filter is only as good as the host's PHP configuration, and enabling it is half a detection rule and
# half a deployment check.
#
# False positives: a legitimate upload that exceeds memory_limit produces the same line. That is a
# real risk and it is why the jail should use a longer `findtime` than the scanner jail - a person
# uploading something too large is a one-off, a body-parsing attack is a burst. It is also why the
# vendor mitigation (raise or remove memory_limit) makes this filter useless: with no limit there is no
# fatal, and the bug is triggered by the absence of a fatal? No - the bug needs the fatal. Removing the
# limit stops this observable but also stops the exploit path that depends on an allocation failure.
#
# Repo source of truth: projects/fleet-filter/detector/fail2ban/filter.d/php-fatal.conf

[Definition]

# Apache error log, with the fractional-second timestamp the stock format uses.
datepattern = ^\[%%a %%b %%d %%H:%%M:%%S(?:\.\d+)? %%Y\]

# `PHP Fatal error:` then the Zend memory-manager text. Both the allocation-size and the
# exhausted-limit numbers vary, so neither is pinned.
failregex = ^\[.*\] \[php:error\] \[pid \d+:tid \d+\] \[client <HOST>:\d+\] PHP Fatal error:\s+Allowed memory size of \d+ bytes exhausted

ignoreregex =
