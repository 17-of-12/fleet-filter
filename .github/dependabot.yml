version: 2

# Dependabot opens one PR per ecosystem per day at most, because a security tool that drowns its
# maintainers in dependency churn is a security tool nobody reviews.
updates:
  - package-ecosystem: cargo
    directory: /gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    # Actions are pinned to commit SHAs; dependabot updates the SHA and the `# vN` comment together.
    # A toolchain version is NOT an action version: it lives in `with: toolchain:` and is pinned by
    # ADR-0001, so a bump there is a decision, never a dependency update.
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
