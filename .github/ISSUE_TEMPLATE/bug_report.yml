name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security vulnerability belongs in the [private reporting form](../security/advisories/new),
        not here. See [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact request, policy fragment or command. A reproduced failure is worth ten descriptions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, and the gateway's `--version`.
    validations:
      required: true
  - type: dropdown
    id: topology
    attributes:
      label: Deployment topology
      options:
        - edge-tls
        - behind-lb-plain
        - behind-lb-tls
        - not deployed yet / lab
        - other (describe above)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Redact addresses and hostnames if they are not yours to publish.
      render: text
