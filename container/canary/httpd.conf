# Canary Apache configuration for the Stage 3 container image (Bundle V).
#
# Baked into `fleet-filter-apache` at /etc/httpd/conf/httpd.conf. It is deliberately not the
# host's main config: the host listens on :80, :443 and 198.51.100.110:8088, while the canary runs
# in its own network namespace as a non-root user and can only serve an unprivileged port. The
# canary is the cleartext backend the Stage 2 gateway proxies to - TLS terminates at the gateway -
# so mod_ssl is not installed in the image at all.
#
# Everything that matters for parity with the native vhosts is reproduced here: the same MPM
# (event, from the RPM), the same DocumentRoot, the same Directory policy, and the same Stage 1
# enforcement map.

ServerRoot "/etc/httpd"
ServerName  fleet-filter-canary:8080
Listen      8080

# The container runs as 1001:1001 (see container/config.yaml), and the image defines that uid as
# `fleet-filter-apache`. Apache's User/Group take names, not bare numbers - a numeric value needs a
# leading backslash - and `User 1001` fails with `AH00543: httpd: bad user name 1001` even when the
# uid exists. Measured on the 0.1.0 image build; the name form is what works and keeps the uid, the
# compose `user:` field, and this directive in one agreement.
User  fleet-filter-apache
Group fleet-filter-apache

ServerTokens    OS
ServerSignature Off
TraceEnable     Off

TypesConfig     /etc/mime.types

# Measured against the native httpd.conf (W3): it sets `AddDefaultCharset UTF-8` and
# `DirectoryIndex index.html`, so without these the same file is served with a different
# Content-Type and a directory that resolves natively 404s in the canary.
AddDefaultCharset UTF-8
DirectoryIndex  index.html

# All modules come from the httpd RPM the image installs; nothing is loaded from outside
# /usr/lib64/httpd/modules, which is what makes the module list reproducible from the image.
Include conf.modules.d/*.conf

DocumentRoot "/var/www/html"

# Mirrors the host: `/` denied, the served tree granted with FollowSymLinks and AllowOverride All.
<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "/var/www/html">
    Options     FollowSymLinks
    AllowOverride All
    Require     all granted
</Directory>

<Files ".ht*">
    Require all denied
</Files>

# A custom main config owns its log formats: without these LogFormat lines, `CustomLog ... combined`
# is not a nickname but a literal format string, and every access log line becomes the word
# "combined" (measured on the first 0.1.0 run). The correlated format matches the field set the
# native gateway-backend vhost logs, so one log parser serves both backends.
LogFormat "%h %l %u %t \"%r\" %>s %b" common
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
# `client=` carries the address the vhost actually acted on. Measured on this build, %h keeps
# reporting the connection address even after mod_remoteip resolves a different client (a request
# classified as 203.0.113.9 was logged with %h=10.89.0.1), and the X-Forwarded-For header itself is
# consumed - `%{X-Forwarded-For}i` is empty whenever the peer was trusted enough to have its header
# believed. SetEnvIf Remote_Addr does read the resolved address, so the vhost's own `tarpit-client`
# variable is the field that names the real client, and it is the one a quarantine decision is
# audited against.
# `xfp=`/`xfv=` record what the gateway asserted about the client's transport. PTN-07 changed
# X-Forwarded-Proto from carrying the HTTP version (`h2`, `HTTP/1.1`) to carrying the scheme
# (`https`/`http`), and a header the backend acts on but never logs is a header nobody can audit
# after the fact - a wrong value there changes redirects, `Secure` cookie flags and canonical URLs
# with nothing in the access log to show for it. Recording both fields also keeps the two facts
# separate in the log, which is the point of the fix.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" client=%{tarpit-client}e reqid=%{X-Request-Id}i xff=%{X-Forwarded-For}i xfp=%{X-Forwarded-Proto}i xfv=%{X-Forwarded-Version}i" correlated

ErrorLog  /var/log/httpd/error_log

IncludeOptional conf.d/*.conf
