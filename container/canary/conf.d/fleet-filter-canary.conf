# Stage 1 enforcement for the Stage 3 canary (Bundle V) - baked into the image at
# /etc/httpd/conf.d/fleet-filter-canary.conf.
#
# The rules are the same three-state semantics the native vhosts use, and they read the same
# /etc/httpd/tarpit-ips.map the controller renders, so a client quarantined by the gateway is
# quarantined here too. What differs from the native vhost is the action for state 1: natively
# state 1 is proxied to the slow-drip responder, and inside the canary there is no responder to
# proxy to, so state 1 answers locally with the reviewed 403 shape. That is the same response the
# gateway's inline `generic` profile produces, which keeps one observable answer for one class.

<VirtualHost *:8080>
    ServerName   fleet-filter-canary
    DocumentRoot /var/www/html

    # The Stage 2 gateway speaks HTTP/1.1 upstream by design (ADR-0001 / Bundle O), so the
    # canary advertises nothing else. A container that advertises h2c here would be a
    # configuration the fleet's own gateway never exercises.
    Protocols    http/1.1

    TraceEnable  Off

    # --- client identity behind a proxy (Bundle X1) -------------------------------------------
    # Stage 3's number-one listed risk, measured: on a podman bridge network the container sees the
    # CNI gateway (10.89.0.1 on the compose network, 10.88.0.0/16 on the default one) as the client,
    # so the access log and the RewriteMap lookup below both classify the bridge instead of the
    # attacker. mod_remoteip replaces REMOTE_ADDR with the address a *trusted* proxy put in
    # X-Forwarded-For, and leaves it alone for anyone else, so an untrusted client cannot forge its
    # own identity by sending the header. The Stage 2 gateway always sets XFF from the socket peer it
    # accepted, which is what makes gateway -> container attribution correct end to end.
    RemoteIPHeader        X-Forwarded-For
    # Apache's parser only recognises '#' at the start of a line, so these three carry no trailing
    # comments: `RemoteIPInternalProxy 127.0.0.1 # note` hands the module '#' as an argument and
    # httpd -t fails with "RemoteIP: Error parsing IP #". Measured on the ede1b3a image build.
    # 127.0.0.1 - a local process on the host, which is how the gateway and every test reach it.
    RemoteIPInternalProxy 127.0.0.1
    # 10.89.0.0/16 - the compose project network (gateway 10.89.0.1), measured as the peer address
    # for anything reaching the container through its published port.
    RemoteIPInternalProxy 10.89.0.0/16
    # 10.88.0.0/16 - podman's default network, trusted so a recreate onto it does not blind the vhost.
    RemoteIPInternalProxy 10.88.0.0/16

    # --- authenticated surface (closes the P2 authenticated-200 case) -------------------------
    # The native 8088 vhost answers a valid Basic credential with 401/AH01629 without ever invoking
    # mod_authn_file, so the authenticated half of Bundle P could not be proven there (see
    # data/results/gateway-parity-2026-11-15.md). This vhost is project-owned, so it is where the
    # question gets answered. It protects its own file rather than /ai.html, because the vhost parity
    # suite compares /ai.html byte-for-byte against the native vhost and an undocumented 401 there is
    # an abort condition in docs/container/migration-runbook.md section 6.
    <Files "x-auth-probe.html">
        AuthType     Basic
        AuthName     "fleet-filter-canary"
        AuthUserFile /etc/fleet-filter-canary/htpasswd
        Require      valid-user
    </Files>

    # URL surface parity (Bundle W3). The native host publishes these through phpldapadmin.conf,
    # shib.conf and welcome.conf; the image ships only its own conf.d, so without these the canary
    # 404s paths the native vhost serves, even though the files behind them are already mounted
    # read-only into the container. Each alias points at a mount the configuration declares, so an
    # alias can never reach a path the project has not agreed to expose.
    Alias /phpldapadmin        /usr/share/phpldapadmin/htdocs
    Alias /ldapadmin           /usr/share/phpldapadmin/htdocs
    Alias /ldap                /usr/share/phpldapadmin/htdocs
    Alias /shibboleth-sp/main.css /usr/share/shibboleth/main.css
    Alias /poweredby.png       /usr/share/httpd/icons/apache_pb3.png
    Alias /.noindex.html       /usr/share/httpd/noindex/index.html

    <Directory /usr/share/phpldapadmin/htdocs>
        Options     FollowSymLinks
        AllowOverride All
        Require     all granted
    </Directory>

    <Directory /usr/share/shibboleth>
        Options     FollowSymLinks
        AllowOverride None
        Require     all granted
    </Directory>

    # Apache 2.4.37 does not expose REMOTE_ADDR to mod_headers on proxied requests, so the client
    # address is captured with SetEnvIf first - the form measured to work on this fleet.
    SetEnvIf Remote_Addr "^(.*)$" tarpit-client=$1

    RewriteEngine On
    RewriteMap   tarpit "txt:/etc/httpd/tarpit-ips.map"

    # State 2 - over quota. Cheapest possible answer, no body work, no backend involvement.
    # The class is published by naming a variable on the rule that fires, not by an unconditional
    # Header line: the first version set `X-Fleet-Filter-Class` from `tarpit-client`, which SetEnvIf
    # defines for *every* request, so even an unmapped client was told it had been tarpitted.
    # `env=` gates the header on the variable existing, and E= is readable by mod_headers here
    # because these are locally served responses (the fleet's earlier finding was that E= is not
    # visible to mod_headers on *proxied* requests, which is why the native vhost captures the
    # address with SetEnvIf instead).
    RewriteCond  ${tarpit:%{REMOTE_ADDR}} =2
    RewriteRule  ^.* - [R=503,L,E=tarpit-class:over-quota]

    # State 1 - quarantined. Served locally for the same reason the gateway serves it inline.
    RewriteCond  ${tarpit:%{REMOTE_ADDR}} =1
    RewriteRule  ^.* - [R=403,L,E=tarpit-class:tarpitted]

    # One header, one source: it exists only when a rule above named a class.
    Header       always set X-Fleet-Filter-Class "%{tarpit-class}e" env=tarpit-class

    ErrorLog  /var/log/httpd/canary-error_log
    # `correlated`, not `combined`: measured on this build, %h stays the connection address even when
    # mod_remoteip has resolved a different client (a request classified as 203.0.113.9 was logged as
    # 10.89.0.1), so the forwarded identity has to be logged on purpose. The format already exists in
    # httpd.conf and carries reqid plus xff, which is what makes a canary log line traceable back to
    # the gateway request that produced it.
    CustomLog /var/log/httpd/canary-access.log correlated
</VirtualHost>
