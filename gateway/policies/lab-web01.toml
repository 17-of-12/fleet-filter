# Policy bundle for lab-web01.lab - the Stage 2 gateway's installed policy (Bundle S1).
#
# This file is the source of truth for what the deployed gateway does. Everything the binary can be
# told is here rather than only in the systemd ExecStart, because S4's question ("which hosts are on
# policy vN?") has to be answerable from the file the host is running, not from a unit file that may
# have been edited without a rebuild.
#
# Deployed to /etc/fleet-filter-gateway/policy.toml and referenced with --policy; the gateway prints
# its identity with --show-policy and re-reads it on SIGHUP (see gateway/src/policy/mod.rs).
#
# The values mirror the O2/O3 deployment: the TEST-NET listener and its backend, the controller's
# rendered map, and the gateway's own spool. The [detection] table below is generated from
# controller/signatures/signatures.yaml by bin/render-gateway-detection.py; edit the store, not this file.

[policy]
schema_version = 1
version = "lab-web01-t1"
generated_at = "2026-11-14T19:40:00Z"
source_commit = "ff6039d"
mode = "serve"

[listener]
bind = "198.51.100.111:8443"
tls_cert = "/etc/fleet-filter-gateway/tls/lab-web01.crt"
tls_key = "/etc/fleet-filter-gateway/tls/lab-web01.key"
alpn = ["h2", "http/1.1"]

[limits]
max_connections = 512
max_connections_per_source = 16
max_body_bytes = 8388608
max_headers = 100
header_read_timeout_secs = 30

# Bundle X3 cutover (2026-11-15): the upstream moved from the native backend 198.51.100.110:8088 to
# the Stage 3 canary 127.0.0.1:18080. The native vhost stays running and warm - reversal is this one
# line plus a SIGHUP, which is what X3 asks for - and the canary now resolves real client addresses
# through mod_remoteip, which is the condition migration-runbook.md section 4.4 attaches to the move.
[routing]
default_backend = "http://127.0.0.1:18080"
forward_headers = true

[quarantine]
map = "/etc/httpd/tarpit-ips.map"
map_ttl = 60
map_memo_ttl = 300
fallback = "allow"
on_quarantined = "inline"

[spool]
dir = "/var/lib/fleet-filter-gateway/spool"
min_interval = 300
max_entries = 10000

# Generated by bin/render-gateway-detection.py - do not edit the [detection] table by hand.
#   store: controller/signatures/signatures.yaml
#   store_sha256: 860ad0b5a052d8a8816b7384478926ff1a35e8d871a36583718f688160941b93
#   generated_at: 2026-11-16T17:46:09Z
#   variants: 4 enforced, 4 unsupported, 0 log-only, 2 disabled
#
# `prefixes` is the literal projection the gateway matches (it pins no regex crate, so it
# cannot match a pattern - only the literals the store declares). `signatures` lists every
# variant the store contains, in `ID:variant` form, so the policy states what the store
# knows even where the gateway cannot enforce it.
[detection]
prefixes = [
  "////wp-json/batch/v1",
  "///wp-json/batch/v1",
  "//wp-json/batch/v1",
  "/?rest_route=/batch/v1",
  "/h2probe-",
  "/index.php?rest_route=/batch/v1",
  "/wp-json/batch/v1",
]
signatures = [
  "CVE-2026-119618:bodyless_ct",
  "CVE-2026-119618:connect_ct",
  "CVE-2026-119618:filler_headers",
  "CVE-2026-119618:framing_only_shapes",
  "CVE-2026-119618:h2c_preface_on_http1_only",
  "CVE-2026-119618:probe_path",
  "CVE-2026-60137:author_not_in_injected",
  "CVE-2026-63030:batch_route_pretty",
  "CVE-2026-63030:batch_route_query",
  "CVE-2026-63030:batch_route_slash_collapse",
]
# not enforced by the gateway: CVE-2026-60137:author_not_in_injected (unsupported: uri_regex '^(?:/wp-json)?/wp/v2/[a-z0-9_-]+\\?[^#&]*(?:&[^#&]*)*author(?:_exclude|__not_in)=([^&]*[^0-9a-zA-Z,&][^&]*)$' has no literal prefix; declare gateway_prefixes to enforce it)
# not enforced by the gateway: CVE-2026-119618:h2c_preface_on_http1_only (unsupported: variant declares no uri_regex (gateway matches URI prefixes only))
# not enforced by the gateway: CVE-2026-119618:bodyless_ct (unsupported: variant declares no uri_regex (gateway matches URI prefixes only))
# not enforced by the gateway: CVE-2026-119618:connect_ct (unsupported: variant declares no uri_regex (gateway matches URI prefixes only))
# not enforced by the gateway: CVE-2026-119618:filler_headers (disabled: Stock Apache cannot log an arbitrary header set in one field; enabling this before header capture exists would be a silent no-op. Enable with ModSecurity transaction args, or with the tarpit's own request capture.)
# not enforced by the gateway: CVE-2026-119618:framing_only_shapes (disabled: body_ct, bodyless_ct_trailers, bodyless_ct_cont, bodyless_ct_rst and body_ct_rst leave no distinct trace in the access log. Detecting these needs an h2-aware engine (ModSecurity with FEATURE_REQUEST_HEADERS or the tarpit's own frame capture), not a log regex.)

[posture]
active = "standard"
methods = ["GET", "HEAD", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
header_names = []
content_types = []
max_path_bytes = 4096
max_query_bytes = 4096
max_path_segments = 128
min_tls_version = "1.2"
admission_cap_per_authority = 0

[deception]
# Bundle T1: quarantined and detected clients are answered from static inline profiles instead of
# being proxied, so a hostile request costs the gateway a slot and a body instead of a backend
# connection. The budget is the whole point: `max_concurrent_drips` is what keeps a scanner burst
# from turning "slow" into "out of memory", and the surplus is refused rather than queued.
detected_profile = "exploit-probe"
quarantined_profile = "generic"
max_concurrent_drips = 32
max_drip_ms = 8000
per_connection_max_bytes = 65536
