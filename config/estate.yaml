# What this estate actually runs and serves.
#
# This file is the difference between "17,000 CVEs last month" and a worklist. A CVE that does not
# name a product in this file cannot be exploited through this deployment, so it is excluded before
# anything expensive happens. Keeping it as data rather than code means the triage output can be
# explained by pointing at a line.
#
# `running` is what is deployed, not what is newest. A version is listed only if it is on a host:
# listing a version that is not deployed produces work for an attack that cannot land here.
#
# Matching is by CPE vendor:product from the NVD record. When a record carries no CPE (common
# immediately after publication), `keywords` decides, and anything matched that way is marked
# `via: keyword` in the output so the weaker evidence is visible rather than averaged in.
#
# `kind` says what sort of thing the entry is (webapp, server, language, library). CPE part `a` calls
# ffmpeg and Chrome applications, so the feed cannot answer "are we defending apps or plumbing";
# the word has to be declared here, because a field nobody sets is a field that always reads
# `unclassified`.

estate:
  # Declared by name, like WordPress, and for a sharper reason. The lab victim is 2.4.49 and the
  # fleet host is 2.4.66, but a version list makes the second number the estate's opinion about
  # every CVE: a 2.4.71 vulnerability is still an Apache httpd vulnerability, and the patch level a
  # host runs tomorrow is not the one it runs today. `running` stays as a record of what is deployed
  # for an operator to read; it is no longer what gates the match.
  - name: apache httpd (2.4.49 and 2.4.66 deployed; declared by name)
    vendor: apache
    product: httpd
    kind: server
    any_version: true
    running: ["2.4.49", "2.4.66"]

  # Same reasoning: PHP ships a security release most months, and a CVE naming a version newer than
  # the one deployed is still a shape this proxy will see the week the host is patched.
  - name: php engine (8.4.26 deployed; declared by name)
    vendor: php
    product: php
    kind: language
    any_version: true
    running: ["8.4.26"]

  # Any version, on purpose. The lab victim is 6.9.4 and one host was 6.8; pinning either number
  # under-reports every other install, and a WordPress site is upgraded by whoever notices rather
  # than by a change window. What matters for triage is that a CVE names WordPress at all - the
  # signature is written against a request shape, and the shape does not change with a minor bump.
  - name: wordpress (any version; the site is upgraded when someone notices)
    vendor: wordpress
    product: wordpress
    kind: webapp
    any_version: true

  # TLS library: same. Pinning 3.0.13 would hide every CVE for 3.0.14 onwards.
  - name: openssl (TLS endpoints, declared by name)
    vendor: openssl
    product: openssl
    kind: library
    any_version: true
    running: ["3.0.13"]

# Used only when a CVE has no CPE configuration. Matching a phrase here is weaker evidence than a
# CPE match, and the output says which one it was.
keywords:
  - "apache http server"
  - "http server 2.4"
  - "php"
  - "wordpress"
  - "mod_http2"
  - "openssl"
