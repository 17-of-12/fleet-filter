# Fleet-Filter local allowlist - deployed to /etc/adaptive-tarpit/allowlist on each host.
#
# Format contract (matches controller/adaptive-tarpit.py:load_allowlist, which parses each line
# as `line.split("#", 1)[0].strip()`):
#   * one address per line;
#   * a comment may follow an address only after a `#` - prose without a `#` becomes part of the
#     entry and the address stops matching ("1.2.3.4 note" is not the entry "1.2.3.4");
#   * whole-line `#` comments and blank lines are ignored.
#
# An address here is never leased, on any verdict from any source (local or fleet), and always
# renders as 0.
#
# 127.0.0.1 - the host's own address. mod_proxy connects to the local responder from here and
# controller health checks originate here; leasing it makes the host tarpit its own requests.
# 198.51.100.111 - the Stage 2 gateway listener address (Bundle O). The backend vhost records the
# gateway as the connection source for every proxied request, so without this entry a single
# Tier 1 or 4xx detection in that log lets Fail2ban/Wazuh quarantine the gateway itself and
# tarpit every request the gateway proxies - an outage caused by the defence, not the attacker.
127.0.0.1
198.51.100.111
# The Stage 2 backend listener address. Measured 2026-11-14: when the gateway on 198.51.100.111
# opens a connection to the backend at 198.51.100.110:8088, the kernel sources it from 198.51.100.110
# (same host, address on lo), so Apache sees REMOTE_ADDR=198.51.100.110 - not the gateway's own
# address - and applied the map entry for it to the gateway's own hop. With .110 leased as
# tarpitted, every proxied request cost 5.25s (the responder's drip) instead of 1ms. Allowlisting
# the backend address is what keeps the enforcing layer from quarantining the path it proxies over.
198.51.100.110
