# =====================================================================
# Fleet-Filter signature store (Path A - exploit signatures)
# Schema: docs/spec/DETECTION-INPUTS.md section 3
# Provenance rule: every pattern here is derived from a named source in
# `source:`. No folklore patterns. See data/research/cve-2026-119618-2026-11-12.md
# =====================================================================

# --- Required log format for any signature whose `match` names a header field.
# Apache's combined format does not include request headers, so header-targeting
# signatures are refused unless the vhost logs this format (section 7 rule:
# a silent no-op is worse than a refusal).
log_formats:
  combined_plus_headers: |
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" ct=%{Content-Type}i cl=%{Content-Length}i ho=%{Host}i" tarpit

signatures:


  # ------------------------------------------------------------------
  # WP2Shell - WordPress Core unauthenticated RCE chain, disclosed 2026-07-17.
  # Two CVEs chained: CVE-2026-60137 (SQLi via `author__not_in`) and CVE-2026-63030
  # (RCE via REST API batch route confusion). Patterns below are derived from the
  # vendor-published attack data, not invented:
  #   https://www.wordfence.com/blog/2026/07/wp2shell-wordpress-exploit-technical-analysis-and-real-attack-data/
  # The article reproduces the exact request an attacker sends; the URI forms in
  # `tests` are those requests (and the ordinary WordPress URIs that must not match).
  # ------------------------------------------------------------------
  - id: CVE-2026-63030
    cve: CVE-2026-63030
    title: WordPress Core REST API batch route confusion RCE (WP2Shell)
    source: https://www.wordfence.com/blog/2026/07/wp2shell-wordpress-exploit-technical-analysis-and-real-attack-data/
    class: exploit
    # `app`: the vulnerable code is WordPress PHP, downstream of Apache. A gateway match is
    # therefore DECEPTION (the request was never going to be exploited by Apache itself), which
    # is exactly the class of traffic the owner wants tarpitted instead of proxied.
    vuln_layer: app
    response_profile_default: slow_404_app_shaped
    verdict_to_report: vulnerable
    applies_to: [all]
    fp_guard: []
    ttl: 259200
    added: 2026-11-16
    review_by: 2027-05-16
    evidence_max_bytes: 512

    variants:

      # The batch endpoint itself, with pretty permalinks on. The published exploit is a POST
      # with Content-Type: application/json; a GET of the same path is a normal REST discovery
      # request, so the method is part of the signature rather than an afterthought.
      - name: batch_route_pretty
        tier: [1, 2]
        match:
          uri_regex: '^/wp-json/batch/v1$'
          method: [POST]
        response_profile: slow_404_app_shaped
        verdict_to_report: vulnerable
        tests:
          positive:
            - /wp-json/batch/v1
          negative:
            - /wp-json/batch/v1/
            - /wp-json/batch/v2
            - /wp-json/wp/v2/posts
            - /batch/v1
            - /wp-json/
        apache_inline: |
          RewriteCond %{REQUEST_URI} ^/wp-json/batch/v1$
          RewriteRule .* - [S=1]         # placeholder; real rule set generated by controller

      # The same endpoint reached the "pretty permalinks off" way, which is the form the
      # published exploit actually used (`POST /?rest_route=/batch/v1`). Both spellings have to
      # be in the store or a host with permalinks disabled is invisible to the gateway.
      - name: batch_route_query
        tier: [1, 2]
        match:
          uri_regex: '^(?:/|/index\.php)\?rest_route=/batch/v1$'
          method: [POST]
        # The pattern opens with an alternation, so it has no single literal prefix for the
        # gateway to match; the two spellings are named here instead of being re-derived.
        gateway_prefixes:
          - /?rest_route=/batch/v1
          - /index.php?rest_route=/batch/v1
        response_profile: slow_404_app_shaped
        verdict_to_report: vulnerable
        tests:
          positive:
            - /?rest_route=/batch/v1
            - /index.php?rest_route=/batch/v1
          negative:
            - /?rest_route=/wp/v2/posts
            - /?rest_route=/batch/v1/
            - /?author_exclude=1
            - /index.php?page_id=7
        apache_inline: |
          RewriteCond %{REQUEST_URI} ^(?:/|/index\.php)\?rest_route=/batch/v1$
          RewriteRule .* - [S=1]         # placeholder; real rule set generated by controller

      # Route-confusion artefact: the exploit's sub-request paths collapse to repeated slashes
      # (`///wp-json/...`) when the batch controller re-dispatches a validated sub-request to an
      # unintended callback. Observed in vendor telemetry as the durable network indicator.
      - name: batch_route_slash_collapse
        tier: [1, 2]
        match:
          uri_regex: '^/{2,}wp-json/batch/v1$'
          method: [POST]
        # `/{2,}` derives the literal `/`, which would flag every request on the host, so the
        # observed spellings are named instead.
        gateway_prefixes:
          - //wp-json/batch/v1
          - ///wp-json/batch/v1
          - ////wp-json/batch/v1
        response_profile: slow_404_app_shaped
        verdict_to_report: vulnerable
        tests:
          positive:
            - //wp-json/batch/v1
            - ///wp-json/batch/v1
            - ////wp-json/batch/v1
          negative:
            - /wp-json/batch/v1
            - ///wp-content/plugins/x.php
            - //index.php
        apache_inline: |
          RewriteCond %{REQUEST_URI} ^/{2,}wp-json/batch/v1$
          RewriteRule .* - [S=1]         # placeholder; real rule set generated by controller

  # ------------------------------------------------------------------
  # CVE-2021-41773 / CVE-2021-42013 - Apache 2.4.49 path traversal to RCE in the CGI path.
  # Addressed in 2.4.50 (incompletely: CVE-2021-42013), then 2.4.51.
  #   https://httpd.apache.org/security/vulnerabilities_24.html
  #   https://nvd.nist.gov/vuln/detail/CVE-2021-41773
  #   https://nvd.nist.gov/vuln/detail/CVE-2021-42013
  # The traversal needs an aliased directory reachable without `Require all denied`; the lab victim
  # `ff-apache02` runs 2.4.49 with `ScriptAlias /cgi-bin/` and is exploitable (measured 2026-11-24:
  # `GET /cgi-bin/.%2e/.%2e/.%2e/.%2e/etc/passwd` reached the backend and returned 500 before the
  # gateway existed, which is the whole reason this signature is here).
  #
  # `vuln_layer: request` - unlike CVE-2026-119618 the vulnerable code runs after the URI is parsed,
  # so a rewrite-level match on the encoded path genuinely prevents the filesystem access. That is
  # why this one is enforceable at both tiers.
  # ------------------------------------------------------------------
  - id: CVE-2021-41773
    cve: CVE-2021-41773
    title: Apache 2.4.49 path traversal in the CGI-alias path (leading to RCE)
    source: https://httpd.apache.org/security/vulnerabilities_24.html
    class: exploit
    vuln_layer: request
    response_profile_default: generic_slow
    verdict_to_report: absent
    applies_to: [2.4.49]
    fp_guard: []
    ttl: 86400
    added: 2026-11-24
    review_by: 2027-05-24
    evidence_max_bytes: 512

    variants:

      # The CVE-2021-41773 form. Apache decodes `%2e` to `.` *after* the URI is split, so `/.%2e/`
      # walks up a level that the path normaliser already decided was inside the alias. Only one
      # encoded dot is needed per segment; the PoC uses four segments to reach `/`.
      - name: cgi_encoded_dotdot
        tier: [1, 2]
        match:
          # Requires at least one *encoded* dot: a literal `..` is normalised before it is mapped
          # and is not this CVE, so matching it would flag a harmless path that some CGI scripts
          # legitimately receive. Two dots, one of which is percent-encoded, is the bypass.
          # `.*` because the fixture checker fullmatches: the rule must consume the whole target.
          uri_regex: '^/cgi-bin/(?:%2e%2e|%2e\.|\.%2e)(?:/|%2f).*'
          method: [GET, POST, HEAD]
        # The gateway has no regex engine and compares case-sensitively against the raw target, so
        # the spellings are enumerated. `%2E` uppercase is not covered here and is a known gap for
        # the literal path - a client that varies the hex case walks past this variant, which is
        # exactly the class of variation the learned sentinel exists to catch.
        # The prefix is the *two-dot sequence* and nothing more. An earlier draft ended each prefix
        # with `/`, which made `/cgi-bin/.%2e/` match a single encoded dot - a segment Apache
        # normalises away, not a traversal. Two dots is the property that makes the escape work, so
        # two dots is what the literal carries; the separator is then irrelevant and `%2f` is
        # covered without its own entry.
        gateway_prefixes:
          - /cgi-bin/.%2e
          - /cgi-bin/%2e%2e
          - /cgi-bin/%2e.
        response_profile: generic_slow
        tests:
          positive:
            - /cgi-bin/.%2e/.%2e/.%2e/.%2e/etc/passwd
            - /cgi-bin/.%2e/.%2e/.%2e/.%2e/bin/sh
            - /cgi-bin/%2e%2e/%2e%2e/etc/passwd
            - /cgi-bin/%2e./%2e./etc/passwd
            - /cgi-bin/.%2e%2f.%2e%2fetc/passwd
            - /cgi-bin/.%2e/test.cgi          # one segment up is still an escape
          negative:
            - /cgi-bin/test.cgi
            - /cgi-bin/
            - /cgi-bin/.%2e            # a single dot is not a traversal
            - /cgi-bin/../test.cgi     # plain dot-dot is normalised before it is mapped
            - /cgi-bin/..%2e/
            - /icons/.%2e/.%2e/etc/passwd    # not the aliased directory
            - /index.html
        apache_inline: |
          RewriteCond %{REQUEST_URI} ^/cgi-bin/(?:%2e%2e|%2e\.|\.%2e)(?:/|%2f).*
          RewriteRule .* - [S=1]         # placeholder; real rule set generated by controller

      # CVE-2021-42013: the 2.4.50 fix only handled `.%2e`, so `%%32%65` (a double-encoded `%2e`,
      # decoded twice) still walked. Kept separate because the affected version differs and a host
      # that was patched to 2.4.50 is covered by this one and not by the previous.
      - name: cgi_double_encoded_dotdot
        tier: [1, 2]
        match:
          # Two `%%32%65` in one segment, or `.%%32%65` (which decodes twice to `..`). One alone
          # decodes to a single dot and is not a traversal, so the pair is what the pattern requires.
          uri_regex: '^/cgi-bin/(?:%%32%65%%32%65|\.%%32%65)(?:/|%2f).*'
          method: [GET, POST, HEAD]
        gateway_prefixes:
          - /cgi-bin/%%32%65
          - /cgi-bin/.%%32%65
        response_profile: generic_slow
        tests:
          positive:
            - /cgi-bin/%%32%65%%32%65/etc/passwd
            - /cgi-bin/.%%32%65/.%%32%65/etc/passwd
          negative:
            - /cgi-bin/test.cgi
            - /cgi-bin/%32%65/          # single-encoded percent, not a dot
            - /cgi-bin/%%32%65           # one segment only
        apache_inline: |
          RewriteCond %{REQUEST_URI} ^/cgi-bin/(?:%%32%65%%32%65|\.%%32%65)(?:/|%2f).*
          RewriteRule .* - [S=1]         # placeholder; real rule set generated by controller

  # ------------------------------------------------------------------
  # CVE-2026-60137 - the SQLi half of the same chain. Kept as its own signature rather than
  # folded into CVE-2026-63030 because it is exploitable on 6.8.x, which the batch route
  # confusion is not: the two have different affected ranges and different lifetimes.
  # ------------------------------------------------------------------
  - id: CVE-2026-60137
    cve: CVE-2026-60137
    title: WordPress Core SQL injection via author__not_in (WP2Shell)
    source: https://www.wordfence.com/blog/2026/07/wp2shell-wordpress-exploit-technical-analysis-and-real-attack-data/
    class: exploit
    vuln_layer: app
    response_profile_default: slow_404_app_shaped
    verdict_to_report: vulnerable
    applies_to: [all]
    fp_guard: []
    ttl: 259200
    added: 2026-11-16
    review_by: 2027-05-16
    evidence_max_bytes: 512

    variants:

      # `author_exclude` / `author__not_in` with a value that is not a plain integer list. A real
      # client sends `?author_exclude=12` or `?author__not_in=1,2`; the exploit sends SQL syntax
      # or URL-encoded SQL syntax, which is what makes it distinguishable from normal traffic.
      - name: author_not_in_injected
        tier: [1, 2]
        match:
          uri_regex: '^(?:/wp-json)?/wp/v2/[a-z0-9_-]+\?[^#&]*(?:&[^#&]*)*author(?:_exclude|__not_in)=([^&]*[^0-9a-zA-Z,&][^&]*)$'
          method: [GET, POST]
        response_profile: slow_404_app_shaped
        verdict_to_report: vulnerable
        tests:
          positive:
            - /wp-json/wp/v2/posts?author_exclude=*
            - /wp-json/wp/v2/widgets?author_exclude=*%3Csvg%3E*
            - /wp-json/wp/v2/posts?author__not_in=1%29+UNION+SELECT
            - /wp-json/wp/v2/posts?author_exclude=(1)
            - /wp-json/wp/v2/posts?author_exclude=SELECT+1
          negative:
            - /wp-json/wp/v2/posts?author_exclude=12
            - /wp-json/wp/v2/posts?author__not_in=1,2,3
            - /wp-json/wp/v2/posts?per_page=10
            - /wp-json/wp/v2/posts
            - /wp-json/wp/v2/media?author=7
        apache_inline: |
          RewriteCond %{REQUEST_URI} ^(?:/wp-json)?/wp/v2/[a-z0-9_-]+\?[^#&]*(?:&[^#&]*)*author(?:_exclude|__not_in)=([^&]*[^0-9a-zA-Z,&][^&]*)$
          RewriteRule .* - [S=1]         # placeholder; real rule set generated by controller

  - id: PHP2SHELL
    cve: CVE-2026-109618
    title: PHP2Shell - pre-auth RCE in the PHP engine (session upload progress / OOM)
    source: https://www.wiz.io/blog/php2shell-php-rce
    class: exploit
    vuln_layer: engine
    response_profile_default: generic_slow
    verdict_to_report: absent
    applies_to: [all]
    fp_guard: []
    ttl: 86400
    added: 2026-11-24
    review_by: 2027-05-24
    evidence_max_bytes: 512

    variants:

      # The trigger is a multipart body field parsed during php_request_startup(), before the target
      # script runs. Measured 2026-11-24 on ff-php (php:8.4.26-apache): the published chain A sends a
      # 514-byte body with PHP_SESSION_UPLOAD_PROGRESS at offset 332, and that body got `id` output
      # through the gateway untouched before this marker existed.
      #
      # No log fixtures: an access log has no body, so tier 2 cannot evaluate this variant. The
      # gateway can, because it buffers the body up to max_body_bytes.
      - name: upload_progress_marker
        tier: [1]
        match:
          body_marker: PHP_SESSION_UPLOAD_PROGRESS
        response_profile: generic_slow
        verdict_to_report: absent
        # Added 2026-11-25 while CVE-2026-115560's session was being recorded: `bin/exploit-status.py`
        # looks for fixtures in the 8000 characters after an entry, and this variant had none, so the
        # entry had been passing on words belonging to whichever entry came next. The variant is
        # enforced by the body_markers list, so the renderer never reads `tests` here; the value is
        # the record itself.
        tests:
          positive:
            # The marker itself. What that run filed is stdout transcripts, not the raw request body
            # (chain-a.txt through chain-a-3.txt, summary.json), so the 514-byte body with the field
            # name at offset 332 is the store's own 2026-11-24 measurement, recorded in the comment
            # above - not a byte count that can be re-read from that directory. The same field line is
            # what lab/php-115560/poc.py:80 builds, and that one is recorded verbatim
            # (data/lab/poc-runs/CVE-2026-115560-20261125T213019Z):
            - 'Content-Disposition: form-data; name="PHP_SESSION_UPLOAD_PROGRESS"'
          negative:
            - 'Content-Disposition: form-data; name="PHPSESSID"'   # the session field, not the progress field
            - 'a=1&b=2'                                            # ordinary urlencoded POST
            - ''                                                   # GET/HEAD: no body to search

  # ------------------------------------------------------------------
  # Two entries produced by the triage -> reference-code -> shape chain on
  # 2026-11-25. Both were found by bin/cve-triage.py (a seven-day NVD window
  # against config/estate.yaml), their reference code by bin/poc-index.py, and
  # the literals below by reading that code rather than by describing the CVE.
  # ------------------------------------------------------------------

  - id: CVE-2026-129289
    cve: CVE-2026-129289
    title: PHP-FPM FastCGI record smuggling - smuggled parameter block in a multipart body
    source: https://github.com/tc4dy/CVE-2026-129289-PoC-Exploit
    class: exploit
    vuln_layer: engine
    response_profile_default: generic_slow
    verdict_to_report: absent
    applies_to: [all]
    fp_guard: []
    ttl: 86400
    added: 2026-11-25
    review_by: 2027-05-25
    evidence_max_bytes: 512

    variants:

      # The PoC builds a multipart/form-data request whose body carries a hidden FastCGI parameter
      # block (lib/fcgi.py writes PHP_ADMIN_VALUE, SCRIPT_FILENAME, REMOTE_ADDR, REQUEST_METHOD as
      # ASCII name/value pairs). When the front end reuses its FastCGI connection, PHP-FPM parses the
      # leftover bytes as a fresh request and takes the attacker's PHP_ADMIN_VALUE.
      #
      # Precondition the gateway cannot test for: connection reuse must be on
      # (`fastcgi_keep_conn on`, `enablereuse=on`, or a ProxyFCGISetEnvIf-equivalent). The marker
      # fires regardless, which is deliberate - a request carrying a FastCGI parameter block in its
      # body is not something a browser produces, and the answer to it does not improve by waiting to
      # learn whether reuse happens to be configured.
      #
      # No log fixtures: an access log has no body.
      - name: php_admin_value_marker
        tier: [1]
        match:
          body_marker: PHP_ADMIN_VALUE
        response_profile: generic_slow
        verdict_to_report: absent

      - name: script_filename_marker
        tier: [1]
        match:
          body_marker: SCRIPT_FILENAME
        response_profile: generic_slow
        verdict_to_report: absent

  - id: CVE-2026-115560
    cve: CVE-2026-115560
    title: PHP session upload-progress serialize-handler mismatch (PHP2Shell family)
    source: https://github.com/al4n4n/achilles-heel/tree/main/CVE-2026-115560
    class: exploit
    vuln_layer: engine
    response_profile_default: generic_slow
    verdict_to_report: absent
    applies_to: [all]
    fp_guard: []
    ttl: 86400
    added: 2026-11-25
    review_by: 2027-05-25
    evidence_max_bytes: 512

    variants:

      # The literal the exploit cannot avoid is the upload-progress field name, `PHP_SESSION_UPLOAD_PROGRESS`
      # (`session.upload_progress.name`): the rfc1867 initialiser only writes a progress record when a
      # multipart body carries a field with exactly that name, and the record it writes is the session
      # data the mismatch then mis-reads. Upstream's own detection for this CVE says the same thing -
      # `detection/cve-2026-115560.rules` in the source repo matches
      # `content:"PHP_SESSION_UPLOAD_PROGRESS"; http_client_body`, and so does every reference
      # implementation's request builder (al4n4n, basesixtythree, cveForge, googlesky).
      #
      # Its rule's second content is `content:"|7c|O:"` - the pipe the `php` handler splits the session
      # string at, glued to the `O:` of the serialised object being unserialised. Three bytes is below
      # the gateway's floor for body markers (a marker shorter than 8 bytes "would match ordinary
      # bodies", `gateway/src/policy/mod.rs`), so the payload-side literal is not expressible here
      # without inventing a longer string the exploit does not have to send. The field name is the
      # unavoidable half, and it is the same observable PHP2SHELL's variant carries - the two CVEs
      # share one carrier; what differs is which serialiser wrote the session and which read it back,
      # which is a server setting the request cannot show.
      #
      # Corrected the same day it was added. This variant shipped as `serialize_destroy_marker` with
      # `body_marker: PHP_VAR_UNSERIALIZE_DESTROY`, describing it as "a second knob" the PoC adds. That
      # string is a php-src C flag (main/php_variables.h) quoted in the PoC's docstring; it appears
      # there and in no request builder anywhere, so no traffic could ever have matched it - a marker
      # nobody's traffic contains is a rule that defends nothing. `PHP_SESSION_UPLOAD_PROGRESS` is what
      # the request carries, measured in the run now recorded beside it
      # (data/lab/poc-runs/CVE-2026-115560-20261125T213019Z: RCE at the victim, no RCE through the
      # gateway, `claim=body:PHP_SESSION_UPLOAD_PROGRESS`).
      - name: upload_progress_marker
        tier: [1]
        match:
          body_marker: PHP_SESSION_UPLOAD_PROGRESS
        response_profile: generic_slow
        verdict_to_report: absent
        # A body-marker variant has no URI to project, so bin/render-gateway-detection.py returns
        # before it ever reads `tests`; these are the store's own record of both directions, which is
        # what a finished entry has to carry (step 5 of the skill, and the row `bin/exploit-status.py`
        # prints for it).
        tests:
          positive:
            # the marker itself, as the recorded run's body carries it - lab/php-115560/poc.py:80
            # builds exactly this field line (the full body also names PHPSESSID and a
            # filename="legit.bin" part, here 4 MiB of padding streamed at 16 KiB per 0.15 s):
            - 'Content-Disposition: form-data; name="PHP_SESSION_UPLOAD_PROGRESS"'
          negative:
            - 'Content-Disposition: form-data; name="PHPSESSID"'   # the session field: PHP2SHELL's other rule, not this marker
            - 'a=1&b=2'                                            # ordinary urlencoded POST
            - ''                                                   # GET/HEAD: no body to search

  # ------------------------------------------------------------------
  # CVE-2026-129474 - PHP magic-method backtrace use-after-free, disclosed
  # 2026-11-24 (security@php.net, GHSA-8mjj-2r7p-4hg2). The reference PoC is
  # murrez/php2shell poc.py; the store entry and the lab share one request
  # shape, and the reasons it is a uri_regex variant rather than a body marker
  # are in the variant comment.
  # ------------------------------------------------------------------
  - id: CVE-2026-129474
    cve: CVE-2026-129474
    title: PHP magic-method backtrace use-after-free while collecting __call/__callStatic arguments
    source: https://github.com/murrez/php2shell/blob/a8e24f4efab57f67384909d9408e42a74b973bfb/poc.py#L808-L816
    class: exploit
    # `app`: the vulnerable sink is application PHP - the `__call`/`__callStatic` handler whose
    # arguments the engine collects. Apache itself would not fault; a gateway match on this
    # traffic is DECEPTION of an attempt that would otherwise land, which is the class of
    # traffic the owner wants claimed instead of proxied (same reasoning as CVE-2026-63030).
    vuln_layer: app
    response_profile_default: generic_slow
    verdict_to_report: absent
    applies_to: [all]
    fp_guard: []
    ttl: 86400
    added: 2026-11-26
    review_by: 2027-05-26
    evidence_max_bytes: 512

    variants:

      # Why a uri_regex variant and not a body marker: the exploit's payload is the application's
      # own request body (murrez's builder fills 640 KiB with filler records only so the engine
      # has something to collect); nothing in it is a fixed literal - a real attacker sends the
      # app's data. The unavoidable observable is WHERE the request goes: murrez's scanner only
      # fires this probe at paths where an app is known to dispatch through magic methods, the
      # list below is that list as the pinned commit has it, and cveForge's scanner for the same
      # CVE adds /api/data. `Content-Type: application/json` is part of the reference request
      # but the store schema has no content-type field on uri_regex variants (headers are the
      # posture's `content_types` list, not a variant's match), so it is recorded here, in the
      # request the lab's PoC actually sends, and in the run beside this entry.
      #
      # The two bare paths in the reference list, `/` and `/index.php`, are deliberately NOT in
      # the regex: any POST to the site root (a login form submit on any PHP app) would be
      # claimed by it, and the reference's own hit on those paths means only "the scanner walked
      # there", which `/api/import` et al. already provide without the collateral. Documented
      # here because leaving them out is a decision a future reader will otherwise re-litigate;
      # the recorded run probes them and shows the same app answer they produce everywhere else.
      - name: magic_call_api_routes
        tier: [1, 2]
        match:
          uri_regex: '^(?:/api/import|/api/imports|/api/v1/import|/import|/graphql|/api/data|/rest/V1/guest-carts/estimate-shipping-methods)$'
          method: [POST]
        # The regex opens with an alternation, so it has no single literal prefix for the
        # gateway to match; the spellings are named here instead of being re-derived
        # (the batch_route_query precedent).
        gateway_prefixes:
          - /api/import
          - /api/imports
          - /api/v1/import
          - /import
          - /graphql
          - /api/data
          - /rest/V1/guest-carts/estimate-shipping-methods
        response_profile: generic_slow
        verdict_to_report: absent
        tests:
          positive:
            # the reference probe paths as lab/php-129474/poc.py sends them (the recorded run
            # POSTs each of these to the victim and to both gateway arms):
            - /api/import
            - /api/imports
            - /api/v1/import
            - /import
            - /graphql
            - /api/data
            - /rest/V1/guest-carts/estimate-shipping-methods
          negative:
            - /                 # the app page - served, never a magic-method entry on this fleet
            - /index.php        # ditto (the reference probes it; documented above)
            - /api/status       # the app's declared route: served, not magic-dispatched
            - /wp-json/batch/v1 # CVE-2026-63030's route, not this CVE's
            - /API/import       # case-sensitive path: the reference's paths are lowercase

  # ------------------------------------------------------------------
  # CVE-2026-119618 - mod_http2 assign_headers() race, httpd 2.4.55-2.4.70.
  # Variants are enumerated from the public PoC's own SHAPES registry, not
  # invented: github.com/googlesky/CVE-2026-119618 poc/poc.py lines 303-314
  # plus PROBE_PATH_PREFIX (line 395) and default_headers() (poc/h2.py:276).
  # ------------------------------------------------------------------
  - id: CVE-2026-119618
    cve: CVE-2026-119618
    title: Apache mod_http2 assign_headers RCE
    source: https://github.com/googlesky/CVE-2026-119618
    class: exploit
    # `vuln_layer` decides whether a rewrite-level match is a MITIGATION or only a
    # DECEPTION. `protocol` (this CVE) means the vulnerable code runs while Apache
    # builds the request_rec, upstream of every module hook including mod_rewrite's
    # map_to_storage phase - so matching the request cannot un-run the bug. See
    # docs/spec/DETECTION-INPUTS.md section 3a.
    vuln_layer: protocol
    response_profile_default: generic_slow
    verdict_to_report: vulnerable
    applies_to: [all]
    fp_guard: []
    ttl: 86400
    added: 2026-11-12
    review_by: 2027-05-12
    evidence_max_bytes: 512

    variants:

      # The PoC's functional probe. PROBE_PATH_PREFIX + (now_ms & 0xFFFFFF),
      # e.g. /h2probe-12075394. This is the only PoC artefact that is both
      # unambiguous AND visible in the stock combined access log, because the
      # other eight shapes all request `:path = "/"`.
      - name: probe_path
        tier: [1, 2]                      # inline Apache, and log replay
        match:
          uri_regex: '^/h2probe-[0-9]{1,8}$'
        response_profile: slow_404_app_shaped
        # B9: this variant's answer is a 404, so the honest lie it tells is "not there", not
        # "vulnerable". Declaring it per variant (rather than inheriting the CVE default) is the
        # point of B9: the response and the reported verdict have to agree or the pairing lies.
        verdict_to_report: absent
        verify: >-
          Not yet exercised on a live host. The `/h2probe-<ms>` path is emitted by the PoC's
          `check` mode, which needs the lab's custom access-log format; `probe` and `exploit`
          modes use `:path = "/"` and were exercised instead (see the bodyless_ct variant).
          Validate this one when a lab target is available.
        tests:
          positive:
            - /h2probe-12075394
            - /h2probe-1
            - /h2probe-16777215           # max value of (now_ms & 0xFFFFFF)
          negative:
            - /h2probe                    # no marker
            - /h2probe-                   # empty marker
            - /h2probe-123456789          # 9 digits: outside the mask
            - /h2probe-12075394/extra     # PoC never appends a sub-path
            - /h2probe-abcdef             # decimal only
            - /index.php/h2probe-1234     # PoC does not prefix the path
            - /.env
        apache_inline: |
          RewriteCond %{REQUEST_URI} ^/h2probe-[0-9]{1,8}$
          RewriteRule .* - [S=1]         # placeholder; real rule set generated by controller

      # Applies once h2/h2c are removed from `Protocols` (the vendor workaround).
      # With mod_http2 off the connection, an h2c client's RFC 7540 connection
      # preface `PRI * HTTP/2.0` is parsed by the HTTP/1.1 request-line reader and
      # logged as method `PRI`. That makes an h2c exploit attempt both harmless and
      # trivially matchable - the one case where a rewrite rule genuinely stops this
      # CVE, because the vulnerable parser never touches the connection.
      - name: h2c_preface_on_http1_only
        tier: [1, 2]
        posture: protocols_exclude_h2c        # only meaningful after the downgrade
        match:
          method: [PRI]
        response_profile: slow_400
        # A malformed request answered with a 400 reports nothing installed; see B9 in
        # docs/operations/PROFILES.md for why the verdict has to match the status the profile emits.
        verdict_to_report: absent
        tests:
          log_positive:
            # MEASURED 2026-11-12 on lab-web01:80 (Protocols h2c http/1.1), raw-socket
            # send of the RFC 7540 preface. Apache answered 400 and logged this line.
            - '10.30.72.218 - - [12/Nov/2026:17:54:54 -0500] "PRI * HTTP/2.0" 400 226 "-" "-"'
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "PRI * HTTP/2.0" 400 0 "-" "-" ct=- cl=-'
          log_negative:
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "GET / HTTP/1.1" 200 512 "-" "curl/8.9.1" ct=- cl=-'
        verified: >-
          Measured 2026-11-12 on lab-web01. With `Protocols` unset the vhost served the
          cleartext connection as HTTP/1.1 and logged `"PRI * HTTP/2.0" 400 226`. Setting
          `Protocols h2c http/1.1` on the same vhost made mod_http2 claim the connection
          instead (binary SETTINGS frame back), so the signature is posture-dependent
          exactly as `posture:` declares. Note Apache rejects the request at parse time -
          the response is a fast 400, so this signature is Tier 2 (log) only; a rewrite
          rule never runs for it.

      # shape_bodyless_ct - the PRIMARY trigger shape. A body-less request
      # carrying Content-Type and no Content-Length is what makes
      # assign_headers() take the vulnerable branch. Matchable only if the
      # vhost logs request headers (see log_formats.combined_plus_headers).
      - name: bodyless_ct
        tier: [1]
        requires: header_logging
        match:
          protocol: [h2, h2c]
          # GET is the PoC's primary shape; POST is its table-filling shape (`bodyless_ct_full`,
          # 78 filler headers). Both reach the same vulnerable branch, and a detection that covers
          # only GET leaves the shape that actually wins the race unmatched - measured 2026-11-24
          # on ff-apache01 immediately after the GET-only gateway shape was tested.
          method: [GET, POST]
          content_type_present: true
          # MEASURED on lab-web01 (httpd-2.4.37 / mod_http2-1.15.7): a body-less h2
          # request logs `cl=0`, not `cl=-` - mod_http2 synthesises Content-Length: 0.
          # Both stay accepted because an HTTP/1.1 client that omits the header logs `-`.
          content_length_in: ['-', '0']
        response_profile: generic_slow
        verdict_to_report: vulnerable
        tests:
          log_positive:
            # MEASURED 2026-11-12: real line produced by the upstream PoC's bodyless_ct
            # shape against lab-web01:80. Confirms ct= and cl= and ho= all as predicted.
            - '10.30.72.218 - - [12/Nov/2026:17:57:46 -0500] "GET / HTTP/2.0" 403 123 "-" "-" ct=application/x-www-form-urlencoded cl=0 ho=localhost'
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "GET /h2probe-12075394 HTTP/2.0" 200 512 "-" "-" ct=application/x-www-form-urlencoded cl=-'
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "GET / HTTP/2.0" 200 512 "-" "-" ct=application/x-www-form-urlencoded cl=0'
          log_negative:
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "GET / HTTP/1.1" 200 512 "-" "curl/8.9.1" ct=application/x-www-form-urlencoded cl=-'
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "POST / HTTP/2.0" 200 512 "-" "-" ct=application/x-www-form-urlencoded cl=32'
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "GET / HTTP/2.0" 200 512 "-" "Mozilla/5.0" ct=- cl=-'
            # MEASURED: a real h2 request with no Content-Type (seen from the PoC's other shapes)
            - '10.30.72.218 - - [12/Nov/2026:17:57:47 -0500] "GET / HTTP/2.0" 403 6 "-" "-" ct=- cl=- ho=localhost'
        apache_inline: |
          RewriteCond %{SERVER_PROTOCOL} ^HTTP/2\.[01]$
          RewriteCond %{REQUEST_METHOD} ^(GET|POST)$
          RewriteCond %{HTTP:Content-Type} !^$
          RewriteCond %{HTTP:Content-Length} ^(0|-)?$
          RewriteRule .* - [S=1]

      # shape_connect_ct - CONNECT with a Content-Type header. `CONNECT ... HTTP/2.0`
      # is vanishingly rare in real browser traffic, so this is high fidelity and
      # needs no header logging at all.
      - name: connect_ct
        tier: [1, 2]
        match:
          method: [CONNECT]
          protocol: [h2, h2c]
        response_profile: generic_slow
        verdict_to_report: vulnerable
        tests:
          log_positive:
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "CONNECT localhost:443 HTTP/2.0" 200 0 "-" "-" ct=text/plain cl=-'
          log_negative:
            - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "GET / HTTP/2.0" 200 512 "-" "-" ct=- cl=-'

      # shape_bodyless_ct_full - 78 filler headers named x-pad-000..x-pad-077,
      # each valued "v", to fill the stream header table to exactly 80 entries.
      # The name pattern is PoC-internal; no real client emits x-pad-042.
      - name: filler_headers
        tier: [1]
        requires: header_logging
        enabled: false                    # see section 8: refuse, do not silently no-op
        disabled_reason: >-
          Stock Apache cannot log an arbitrary header set in one field; enabling this
          before header capture exists would be a silent no-op. Enable with ModSecurity
          transaction args, or with the tarpit's own request capture.
        match:
          header_regex: '^x-pad-[0-7][0-9]$'
        response_profile: generic_slow
        verdict_to_report: vulnerable
        tests:
          header_positive: [x-pad-000, x-pad-042, x-pad-077]
          header_negative: [x-pad-078, x-pad-100, x-pad, x-pad-1, x-pad-07a]

      # Remaining PoC shapes, recorded for completeness. They are indistinguishable
      # from ordinary h2 traffic in the access log (all request `:path = "/"`, and
      # END_STREAM / RST_STREAM / CONTINUATION framing is not logged), so they are
      # detectable only by an inline h2-aware engine.
      - name: framing_only_shapes
        tier: [1]
        requires: h2_aware_engine
        enabled: false
        disabled_reason: >-
          body_ct, bodyless_ct_trailers, bodyless_ct_cont, bodyless_ct_rst and
          body_ct_rst leave no distinct trace in the access log. Detecting these
          needs an h2-aware engine (ModSecurity with FEATURE_REQUEST_HEADERS or the
          tarpit's own frame capture), not a log regex.
        shapes: [body_ct, bodyless_ct_trailers, bodyless_ct_cont, bodyless_ct_rst, body_ct_rst]
        response_profile: generic_slow
        verdict_to_report: vulnerable

    # Signals that raise confidence but never quarantine on their own.
    corroborating_signals:
      - name: authority_localhost
        note: >-
          poc/h2.py:276 hardcodes AUTHORITY = "localhost". A request arriving at a
          named vhost whose Host/authority is `localhost` is a scripted client. Not
          CVE-specific, so it corroborates rather than condemns.
        match:
          header_regex: '^localhost$'
          header: Host
        test_positive:
          # MEASURED 2026-11-12: the PoC's hardcoded AUTHORITY="localhost" on a real request.
          - '10.30.72.218 - - [12/Nov/2026:17:57:46 -0500] "GET / HTTP/2.0" 403 123 "-" "-" ct=application/x-www-form-urlencoded cl=0 ho=localhost'
          - '10.20.30.40 - - [12/Nov/2026:16:41:02 +0000] "GET / HTTP/2.0" 200 512 "-" "-" ct=- cl=- ho=localhost'
      - name: poc_internal_header_names
        note: 'x-trailer, x-split, x-probe appear only in the PoC (poc.py:261,281,468).'
        match:
          header_regex: '^x-(trailer|split|probe)$'
        test_positive: [x-trailer, x-split, x-probe]
      - name: h2_on_http1_vhost
        note: >-
          MEASURED 2026-11-14 (data/research/signature-shape-census-2026-11-14.md): 119 of the 120
          HTTP/2.0 requests in 3,813 logged requests came from the PoC address, against 3,638
          HTTP/1.1 requests from 22 addresses. On a vhost where 98% of traffic is HTTP/1.1, arriving
          over HTTP/2.0 is strongly correlated with a scripted client - but it is a protocol
          observation, not a CVE fact, and real HTTP/2 clients exist, so it corroborates and never
          condemns. Added while closing E17(c), which asked about body_ct/bodyless_ct_full: the census
          showed neither would have detected the PoC, and this is the signal the data does support.
        match:
          protocol: [h2, h2c]
