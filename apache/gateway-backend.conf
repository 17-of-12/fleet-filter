# ---------------------------------------------------------------------------
# Fleet-Filter Stage 2 gateway backend vhost - lab-web01.lab
# Added 2026-11-14 by agent@build01.lab (project: Fleet-Filter)
# Bundle O task O1: a dedicated, non-public backend listener whose only job is to be the
# gateway's upstream, so the milestone claim "Apache never processed the client's HTTP/2
# connection" can be falsified rather than argued.
# Revert: delete this file, `systemctl reload httpd`. Take a backup of
#         /etc/httpd/conf.d/ first (project rule: back up before altering).
# ---------------------------------------------------------------------------
#
# Why this listener exists at all
# -------------------------------
# The existing vhosts cannot carry the proof:
#   * `:80` (tarpit-test.conf) advertises `Protocols h2c http/1.1`, so an h2 request to it is
#     in scope for mod_http2 by definition;
#   * `:443` (ssl.conf) has h2 available and serves the real application.
# A listener pinned to `Protocols http/1.1` is the only configuration on this host where
# `curl --http2` can be shown *not* to get HTTP/2, which is what O8 claim (3) requires.
#
# Why 198.51.100.110:8088 rather than 127.0.0.1:8088 or :8089
# -----------------------------------------------------------
# 1. TEST-NET (198.18.0.0/15) is the range this project already uses for synthetic clients on
#    lab-web01, chosen because Wazuh's `firewall-drop` active response targets loopback
#    aliases and previously locked the test harness out (measured 2026-11-13).
# 2. The address is provided by `fleet-filter-testnet-addr.service`; binding to an address that
#    only exists because someone ran `ip addr add` in a past session would make httpd fail to
#    start after a reboot, and that failure would take the real application's :443 vhost with it.
# 3. Port 8088 is not opened in firewalld, so the listener is unreachable from the network -
#    which is what "non-public backend" means here - while still being reachable by the local
#    gateway process.
#
# Known consequence, recorded rather than hidden
# ----------------------------------------------
# A request that arrives via the gateway has REMOTE_ADDR = the gateway's address, so Tier 0
# classifies the *gateway*, not the end client, until mod_remoteip is configured to trust that
# one proxy. The gateway address is therefore on the controller allowlist: without that, a
# single Tier 1 hit seen in the backend's access log would let Fail2ban or Wazuh quarantine the
# gateway itself and tarpit every request it proxies.
# ---------------------------------------------------------------------------

Listen 198.51.100.110:8088

<VirtualHost 198.51.100.110:8088>
    ServerName   gateway-backend.lab-web01.lab

    # The load-bearing line for Bundle O: this vhost offers HTTP/1.1 and nothing else.
    # mod_http2 is loaded host-wide, but with no h2/h2c protocol advertised here it cannot
    # take a connection on this listener, so requests proxied in by the gateway are parsed by
    # the HTTP/1.1 path only.
    Protocols    http/1.1

    DocumentRoot /var/www/html
    TraceEnable  Off

    # Map names are vhost-scoped on httpd 2.4.37 (measured), so this vhost needs its own name
    # for the same file that :80 (`tarpit`) and :443 (`tarpit443`) already use.
    RewriteEngine On
    RewriteMap    tarpit8088 "txt:/etc/httpd/tarpit-ips.map"

    # 2 = over quota: refuse locally, no backend connection, no drip (PT-04).
    RewriteCond   ${tarpit8088:%{REMOTE_ADDR}} ^2$
    RewriteRule   ^(.*)$ - [R=503,L]

    # 1 = tarpit: proxy to the slow-drip responder, same answer as the real vhost, delivered
    # slowly. No E= flags - httpd 2.4.37 does not expose RewriteRule-set env vars to
    # mod_headers, so the gating that used to be here gated nothing.
    RewriteCond   ${tarpit8088:%{REMOTE_ADDR}} ^1$
    RewriteRule   ^(.*)$ http://127.0.0.1:8081$1 [P,L]

    # 0 (or absent) = serve the real DocumentRoot.

    # Tier 1 signatures, generated from controller/signatures/signatures.yaml. Included here
    # for the same reason it is included on the other vhosts: Profile B keeps Stage 1
    # enforcement in place rather than replacing it.
    Include /etc/httpd/tarpit-signatures.conf

    ProxyPreserveHost On

    # O7 join key: the gateway generates one X-Request-Id per forwarded request and this format
    # logs it, so a gateway log line and a backend log line describe the same request without
    # matching on timestamps. Requests that bypass the gateway log `-` here, which is itself the
    # evidence for "this request did not come through the gateway".
    #
    # xff= is logged alongside it because %h on a proxied request is the gateway's address, not the
    # client's: without this field the backend cannot tell who the real client was (the Stage 1
    # PT-10 finding, re-applied to Stage 2).
    LogFormat   "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" reqid=%{X-Request-Id}i xff=%{X-Forwarded-For}i" gatewaybackend
    CustomLog   /var/log/httpd/gateway-backend-access.log gatewaybackend
    ErrorLog    /var/log/httpd/gateway-backend-error.log
</VirtualHost>
