# ---------------------------------------------------------------------------
# Fleet-Filter test vhost - lab-web01.lab
# Added 2026-11-12 by agent@build01.lab (project: Fleet-Filter)
# Revert: delete this file and /etc/httpd/tarpit-ips.map, then
#         `systemctl reload httpd`.  Prior-state backup:
#         /root/backups/20261112T223755Z-fleet-filter-test/
# ---------------------------------------------------------------------------

# Extended format: the header fields Path A signatures match on must be logged,
# otherwise header-targeting signatures are silent no-ops (DETECTION-INPUTS.md 7).
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" ct=%{Content-Type}i cl=%{Content-Length}i ho=%{Host}i" tarpitext

Listen 80

<VirtualHost *:80>
    ServerName   lab-web01.lab
    Protocols    h2c http/1.1
    DocumentRoot /var/www/html

    # TRACE reflects the request line and headers back in the response body (XST). It is on
    # by default and was found by tests/security/test_live_apache.sh; a tarpit vhost has no
    # reason to answer TRACE, and refusing it also denies a scanner a cheap way to confirm
    # the front-end fingerprint. Scoped to this vhost only - ssl.conf is handled separately.
    TraceEnable  Off

    # Tier 0 enforcement: one hash-map lookup per request, map is live-updated
    # by the controller without an Apache restart (txt: entries refresh every 60s).
    # Map values: 0 = serve normally | 1 = tarpit | 2 = over-quota (cheap refusal)
    # PT-04: value 2 must not be proxied. Every proxied tarpit response holds a worker
    # for the whole drip, so the over-quota state exists to stop a mass-ban from
    # spending backend capacity on addresses we already know are uninteresting.
    RewriteEngine On
    RewriteMap    tarpit "txt:/etc/httpd/tarpit-ips.map"

    # 2 = over quota: refuse locally, no backend connection, no drip.
    RewriteCond   ${tarpit:%{REMOTE_ADDR}} ^2$
    RewriteRule   ^(.*)$ - [R=503,L]

    # 1 = the actual tarpit: same answer as the real vhost, delivered slowly.
    # No E= flags here: httpd 2.4.37 does not expose RewriteRule-set environment variables
    # to mod_headers (measured 2026-11-14, see bin/render-signature-rules.py docstring), so
    # the previous `E=tarpit-client=1` never gated anything.
    RewriteCond   ${tarpit:%{REMOTE_ADDR}} ^1$
    RewriteRule   ^(.*)$ http://127.0.0.1:8081$1 [P,L]

    # 0 (or absent) = serve the real DocumentRoot.

    # Tier 1 enforcement (PT-13): generated from controller/signatures/signatures.yaml by
    # bin/render-signature-rules.py. Placement is load-bearing - the Tier 0 rules above end
    # with [L], so anything reaching these conditions is by definition an unmapped client,
    # which is the population Tier 1 exists to catch, and a mapped client never pays the
    # PCRE cost twice.
    # The file lives at /etc/httpd/, not in conf.d/, on purpose: a conf.d copy would also be
    # loaded at server scope, and server-scope mod_rewrite does not apply to requests served
    # by a named vhost (the same scoping rule that forced per-vhost RewriteMap names).
    Include /etc/httpd/tarpit-signatures.conf

    # PT-10 (client attribution) is handled inside the generated file above: it sets
    # X-Tarpit-Client from a SetEnvIf-derived variable. This vhost must not add its own
    # RequestHeader for that name - the previous `%{REMOTE_ADDR}e` form resolved to the
    # literal string `(null)` on httpd 2.4.37, and the responder only reported the right
    # client because it fell back to mod_proxy's X-Forwarded-For.

    # Backend must see the original Host so it can answer per-vhost (I4 consistency).
    ProxyPreserveHost On

    CustomLog   /var/log/httpd/tarpit-test-access.log tarpitext
    ErrorLog    /var/log/httpd/tarpit-test-error.log
</VirtualHost>
