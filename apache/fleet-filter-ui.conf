# Project: Fleet-Filter (Bundle Y1) - Apache front end for the fleet console on build01.
#
# The console application itself is a stdlib Python HTTP service (web/app.py) listening on
# 127.0.0.1:8735 under fleet-filter-ui.service. Apache is the only published surface: it owns
# 8188/tcp, authenticates, and proxies. That ordering is the point - the app has no auth of its
# own, so publishing it directly would expose the console unauthenticated, and the app never
# handles a request the web server did not already authorise.
#
# Deployed to /etc/httpd/conf.d/fleet-filter-ui.conf. Additive: it adds one Listen and one
# VirtualHost and changes nothing in the existing :80/:443 vhosts.
#
# PTN-04 - why this listener is TLS and not plain HTTP.
# The console authenticates with HTTP Basic, which sends `username:password" on every request. On a
# plaintext listener that means the password crosses the network in clear text on *every page load*,
# not just at login, and 8188 is published in firewalld's public zone - so anyone on a path between
# the operator and this host could read it. TLS is not a hardening nicety here; without it the
# credential format itself (Basic, not a session token) is the exposure.
#
# The vhost is TLS-only rather than plain-with-a-redirect because Apache 2.4 requires every
# VirtualHost on one IP:port to agree on SSLEngine - a mixed plain/TLS :8188 answers the plaintext
# half with a protocol error, not a redirect. The published URL is therefore
# https://build01.lab:8188/ and the certificate is the host's own
# /etc/pki/tls/certs/build01.lab/server.crt (SAN: build01.lab), the same pair the
# :443 vhost uses, so rotating one certificate rotates both surfaces together.

Listen 8188

<VirtualHost *:8188>
    ServerName build01.lab
    ServerAlias fleet-filter.build01.lab

    SSLEngine on
    SSLCertificateFile      /etc/pki/tls/certs/build01.lab/server.crt
    SSLCertificateKeyFile   /etc/pki/tls/certs/build01.lab/server.key
    SSLCertificateChainFile /etc/pki/tls/certs/build01.lab/chain.crt
    # Mirrors the host's other TLS vhosts rather than inventing a second cipher policy, so the
    # console follows the system-wide crypto policy (PROFILE=SYSTEM) like :443 does.
    SSLHonorCipherOrder on
    SSLCipherSuite PROFILE=SYSTEM

    # Only meaningful over TLS, and only set when the connection actually was one - `env=HTTPS`
    # keeps a future plaintext listener from promising something it is not keeping.
    Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS

    # No content is served from disk here; the directive exists so an unmatched request gets a
    # plain 404 from Apache instead of being proxied to a path the app does not implement.
    DocumentRoot /var/www/html

    # Separate logs: console traffic should not dilute the host access_log that the controller's
    # signature replay (controller/sigtest.py) and any future log-based detection read from.
    ErrorLog  /var/log/httpd/fleet-filter-ui-error_log
    CustomLog /var/log/httpd/fleet-filter-ui-access_log combined

    # Keep the Host the client used, so redirects the app emits stay on the published port rather
    # than the internal one.
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8735/
    ProxyPassReverse / http://127.0.0.1:8735/

    <Proxy http://127.0.0.1:8735/*>
        Require all granted
    </Proxy>

    <Location />
        AuthType Basic
        AuthName "Fleet Filter console"
        AuthUserFile /etc/fleet-filter-ui/htpasswd
        Require valid-user
    </Location>

    # Forward the authenticated identity to the app so a write (Bundle Y2) can name its actor.
    # `env=REMOTE_USER` matters: without the guard Apache writes the literal `(null)` when the
    # variable is unset, and the app would record `(null)` as the person who disabled enforcement.
    # web/app.py also decodes the forwarded Basic credential as a fallback (see authenticated_user).
    RequestHeader set X-Forwarded-User "%{REMOTE_USER}e" env=REMOTE_USER

    # Monitoring must be able to ask "is the console up" without holding credentials. This answers
    # the app's own /health, so it reports the application, not just the web server.
    <Location /health>
        Require all granted
    </Location>
</VirtualHost>
