        <VirtualHost *:443>
                ServerAdmin web-team@example.edu

                DocumentRoot /var/www/html
                # TRACE reflects the request line and headers back in the body (XST) and is on
                # by default. Found by tests/security/test_live_apache.sh; owner approved
                # disabling it - it is a debugging verb, and this vhost serves an application.
                TraceEnable  Off
                # Fleet-Filter Tier 0 enforcement (project: Fleet-Filter, controller: /usr/local/bin/adaptive-tarpit)
                # Values: 0 = serve normally | 1 = tarpit | 2 = over-quota (cheap refusal)
                RewriteEngine On
                # Map names are context-scoped, so this vhost needs its own name for the
                # same file; 'tarpit' is already taken by the *:80 vhost.
                RewriteMap    tarpit443 "txt:/etc/httpd/tarpit-ips.map"
                # PT-04: 2 = over quota. Refuse locally instead of spending a worker on a
                # proxied drip for an address we already classified.
                RewriteCond   ${tarpit443:%{REMOTE_ADDR}} ^2$
                RewriteRule   ^(.*)$ - [R=503,L]
                # 1 = tarpit this address through the slow-drip responder.
                RewriteCond   ${tarpit443:%{REMOTE_ADDR}} ^1$
                RewriteRule   ^(.*)$ http://127.0.0.1:8081$1 [P,L]
                # Tier 1 enforcement (PT-13), generated from the signature store. Same
                # placement rule as in apache/tarpit-test.conf: after the [L]-terminated
                # Tier 0 rules, so these conditions only see unmapped clients. The same
                # generated file serves both vhosts because it references no map name.
                Include /etc/httpd/tarpit-signatures.conf
                # PT-10 (client attribution) lives inside the generated file above, which
                # sets X-Tarpit-Client from a SetEnvIf-derived variable; this vhost must not
                # add its own RequestHeader for that name (see apache/tarpit-test.conf for
                # why the old %{REMOTE_ADDR}e form was wrong on httpd 2.4.37).
                ProxyPreserveHost On
		servername lab-web01.lab:443

                ErrorLog /var/log/httpd/error_log
                CustomLog /var/log/httpd/access_log combined

                SSLEngine on

                SSLCertificateFile    /etc/ssl/certs/lab-web01.crt
                SSLCertificateKeyFile /etc/ssl/private/lab-web01.key

                <FilesMatch "\.(cgi|shtml|phtml|php)$">
                                SSLOptions +StdEnvVars
                </FilesMatch>
                <Directory /usr/lib/cgi-bin>
                                SSLOptions +StdEnvVars
                </Directory>

                BrowserMatch "MSIE [2-6]" \
                               nokeepalive ssl-unclean-shutdown \
                               downgrade-1.0 force-response-1.0

        </VirtualHost>

Listen 443

SSLCipherSuite EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH
SSLProtocol All -SSLv2 -SSLv3
SSLHonorCipherOrder On
# Disable preloading HSTS for now.  You can use the commented out header line that includes
# the "preload" directive if you understand the implications.
#Header always set Strict-Transport-Security "max-age=63072000; includeSubdomains; preload"
Header always set Strict-Transport-Security "max-age=63072000; includeSubdomains"
Header always set X-Frame-Options DENY
Header always set X-Content-Type-Options nosniff
# Requires Apache >= 2.4
SSLCompression off
#SSLSessionTickets Off
#SSLUseStapling on
SSLStaplingCache "shmcb:logs/stapling-cache(150000)"

# SSLOpenSSLConfCmd DHParameters "/etc/ssl/certs/dhparam.pem"

